name: tardadi_driver
description: TRDDK — تطبيق السائق
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.1.1
  geolocator: ^14.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.5.3
  tardadi_core:
    path: ../../packages/tardadi_core
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/vehicles/
