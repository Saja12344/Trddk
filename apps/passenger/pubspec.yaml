name: tardadi_passenger
description: TRDDK — تطبيق الموظفين
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  google_fonts: ^6.2.1
  flutter_map: ^8.1.1
  google_maps_flutter: ^2.12.1
  latlong2: ^0.9.1
  permission_handler: ^12.0.1
  video_player: ^2.10.0
  tardadi_core:
    path: ../../packages/tardadi_core
  flutter_local_notifications: ^22.0.1
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  shared_preferences: ^2.5.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_icon.png
    - assets/images/logo_full.png
    - assets/images/logo_text.png
    - assets/images/trddk_wordmark.png
    - assets/images/onboarding_map.png
    - assets/images/onboarding_map_dark.jpg
    - assets/videos/tardadi-icon-alpha.mov
    - assets/videos/tardadi-icon.mp4
